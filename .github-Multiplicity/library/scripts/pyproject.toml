[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moc"
version = "0.1.0"
description = "Multiplicity Operator Calculus: prime-indexed dynamics on hypergraphs"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name="Your Name"}]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["moc"]

[tool.pytest.ini_options]
addopts = "-q"
