name: Build Index

on:
  schedule:
    - cron: '0 8 * * *' # daily at 08:00 UTC
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c  # v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml jsonschema

      - name: Install shellcheck (koalaman action)
        uses: koalaman/shellcheck-action@v1

      - name: Validate 'run' blocks with shellcheck
        run: |
          python - << 'PY'
            import yaml, glob, subprocess
            idx=0
            errs=0
            for y in glob.glob('.github/workflows/*.yml'):
              with open(y) as fh:
                try:
                  data = yaml.safe_load(fh)
                except Exception:
                  continue
              def extract(node):
                global idx, errs
                if isinstance(node, dict):
                  for k, v in node.items():
                    if k == 'run' and isinstance(v, str):
                      path = f'/tmp/runblock-{idx}.sh'
                      with open(path, 'w') as out:
                        out.write(v)
                      try:
                        subprocess.run(['shellcheck', path], check=True)
                      except subprocess.CalledProcessError:
                        errs += 1
                      idx += 1
                    else:
                      extract(v)
                elif isinstance(node, list):
                  for i in node:
                    extract(i)
              extract(data)
            if errs:
              raise SystemExit(2)
            print('Shellcheck runblocks OK')
          PY

      - name: Determine changed files
        id: changed
        run: |
          set -e
          # Determine base ref to diff against
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF=${{ github.event.pull_request.base.ref }}
          else
            BASE_REF=${{ github.event.repository.default_branch }}
          fi
          echo "Base ref: $BASE_REF"
          git fetch origin $BASE_REF --depth=1 || true
          CHANGED=$(git diff --name-only origin/$BASE_REF...HEAD | grep -E '\.md$' || true)
          echo "Changed markdown files:\n$CHANGED"
          if [ -z "$CHANGED" ]; then
            echo "files=" >> $GITHUB_OUTPUT
          else
            # convert newline to comma-separated list
            echo "files=$(echo "$CHANGED" | paste -sd ',' -)" >> $GITHUB_OUTPUT
          fi

      - name: Validate front-matter (only changed files)
        run: |
          set -e
          FILES="${{ steps.changed.outputs.files }}"
          if [ -z "$FILES" ]; then
            echo "No changed files found. Validating entire articles directory."
            if [ "${{ github.event_name }}" = "schedule" ]; then
              python3 scripts/validate_frontmatter.py --schema schemas/article-schema.json --path articles --lenient || exit $?
            else
              python3 scripts/validate_frontmatter.py --schema schemas/article-schema.json --path articles || exit $?
            fi
          else
            echo "Validating changed files: $FILES"
            IFS=','; for f in $FILES; do
              python3 scripts/validate_frontmatter.py --schema schemas/article-schema.json --path "$f" || exit $?
            done
          fi

      - name: Run tests
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt || true; fi
          pytest -q || true

      - name: Build indexes
        id: build-index
        run: |
          python3 scripts/build_index.py

      - name: Validate JSON indices
        run: |
          python3 - << 'PY'
          import json, pathlib, sys
          from jsonschema import validate

          root = pathlib.Path.cwd()
          idx = root / 'articles' / 'index.json'
          if not idx.exists():
              print('No articles/index.json found; failing')
              sys.exit(2)
          schema = json.loads((root / 'schemas' / 'index-schema.json').read_text(encoding='utf-8'))
          data = json.loads(idx.read_text(encoding='utf-8'))
          validate(instance=data, schema=schema)
          # tags
          t_idx = root / 'tags' / 'index.json'
          if t_idx.exists():
              tschema = json.loads((root / 'schemas' / 'tags-index-schema.json').read_text(encoding='utf-8'))
              tdata = json.loads(t_idx.read_text(encoding='utf-8'))
              validate(instance=tdata, schema=tschema)
              # validate one tag file if present
              if tdata.get('tags'):
                  slug = tdata['tags'][0]['slug']
                  tagf = root / 'tags' / f"{slug}.json"
                  if tagf.exists():
                      ts = json.loads((root / 'schemas' / 'tag-schema.json').read_text(encoding='utf-8'))
                      td = json.loads(tagf.read_text(encoding='utf-8'))
                      validate(instance=td, schema=ts)
          print('JSON index validation OK')
          PY

      - name: Create PR for generated files (if any changes)
        id: create-pr
        uses: peter-evans/create-pull-request@4e1beaa7521e8b457b572c090b25bd3db56bf1c5  # v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: regenerate indexes'
          title: 'chore: Regenerate indexes'
          body: |
            Automated index regeneration. Files updated: articles/index.md, articles/index.json, tags/index.md, tags/index.json, index.json (repo root)
          base: ${{ github.event.repository.default_branch }}
          branch: 'auto/regenerate-indexes-${{ github.run_id }}'
          labels: 'autofix,generated'

      - name: Install gh CLI
        run: |
          set -e
          gh --version || (sudo apt-get update && sudo apt-get install -y gh)

      - name: Auto-merge generated index PR if allowed and enabled
        if: ${{ secrets.AUTO_MERGE_INDEX_PR == 'true' }}
        run: |
          set -e
          PR_NUM=${{ steps.create-pr.outputs.pull-request-number }}
          BASE="${{ github.event.repository.default_branch }}"
          ALLOWED="${{ secrets.AUTO_MERGE_ALLOWED_BRANCHES }}"
          if [ -z "$ALLOWED" ]; then
            ALLOWED="$BASE"
          fi
          # Normalize ALLOWED (comma separated list) and check for BASE
          echo "Allowed branches: $ALLOWED"
          echo "Base branch: $BASE"
          if echo "$ALLOWED" | tr ',' '\n' | grep -Fxq "$BASE"; then
            echo "Auto-merge allowed for base $BASE. Requesting auto-merge for PR $PR_NUM"
            gh pr merge "$PR_NUM" --auto --merge --admin --body "Auto-merge requested for autogenerated index when required checks pass" || true
          else
            echo "Auto-merge not allowed for base $BASE; skipping auto-merge"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
# Removed duplicate job section; the main build job is defined above
