name: Auto Markdown Lint Fix

on:
  schedule:
    - cron: '0 3 * * *'  # daily 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20'

      - name: Install markdownlint
        run: npm install -D markdownlint-cli

      - name: Run auto fix
        id: lintfix
        run: |
          set -e
          ./scripts/lint_markdown.sh || true
          if [ -n "$(git status --porcelain)" ]; then
            echo "changes detected"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            branch="auto-fix/markdown-$(date +%Y%m%d%H%M%S)"
            git checkout -b "$branch"
            git add -A
            git commit -m "chore: auto-fix markdown lint issues" || true
            git push --set-upstream origin "$branch"
            echo "pr_branch=$branch" >> $GITHUB_OUTPUT
          else
            echo "no_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Create PR (if changes)
        if: steps.lintfix.outputs.no_changes != 'true'
        uses: peter-evans/create-pull-request@4e1beaa7521e8b457b572c090b25bd3db56bf1c5  # v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: auto-fix markdown lint issues'
          title: 'chore: Auto-fix Markdown lint'
          body: |
            Automated commit of Markdown lint fixes. Please review the changes.
          base: ${{ github.event.repository.default_branch }}
          head: ${{ steps.lintfix.outputs.pr_branch }}
